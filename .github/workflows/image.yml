# Docker image ghcr.io/riceharvest/b70-llama: the latest release's SYCL + Vulkan binaries on a pinned Arch Linux snapshot
# (Mesa ANV 26.2.x, compute-runtime, Level Zero). GitHub-hosted runner only; no GPU, so CI checks that every binary's
# libraries resolve and that the Vulkan build runs on lavapipe (CPU Vulkan).
name: image
on:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: [docker/**, .github/workflows/image.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency: { group: image, cancel-in-progress: false }
jobs:
  image:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Download the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          mkdir -p docker/dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir docker/dist \
            -p 'llama-b70-sycl-ubuntu24-x64.tar.gz' -p 'llama-b70-vulkan-ubuntu24-x64.tar.gz' -p SHA256SUMS
          ls -la docker/dist
      - name: Build
        run: docker build --build-arg RELEASE_TAG="$TAG" -t b70-llama:ci docker
      - name: Check
        run: |
          docker run --rm --entrypoint bash b70-llama:ci -c '
            set -e
            pacman -Q vulkan-intel intel-compute-runtime level-zero-loader
            for d in /opt/llama/sycl /opt/llama/vulkan; do
              miss=$(for f in $d/llama-* $d/*.so*; do ldd $f 2>/dev/null | grep "not found"; done | sort -u)
              [ -z "$miss" ] && echo "$d: all libraries resolve" || { echo "$d missing: $miss"; exit 1; }
            done
            /opt/llama/sycl/llama-server --version
            /opt/llama/vulkan/llama-server --version
            b70-llama help | head -3'
          # entry script: device pick with an iGPU next to the B70, user flags win, download name checks (fake binaries)
          docker run --rm -v "$PWD/docker:/t:ro" --entrypoint bash b70-llama:ci /t/test.sh
          # Vulkan on lavapipe (CPU Vulkan; no GPU here), through the entry script: a tiny model generates text, and
          # `b70-llama vulkan` serves it and answers /health
          curl -sSL -o /tmp/stories260K.gguf https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf
          docker run --rm -v /tmp/stories260K.gguf:/models/tiny.gguf:ro -e B70_SKIP_DRI_CHECK=1 -e GGML_VK_VISIBLE_DEVICES=0 \
            --entrypoint bash b70-llama:ci -c '
            set -e
            pacman -Sy --noconfirm --needed vulkan-swrast >/dev/null
            b70-llama run vulkan llama-completion -m /models/tiny.gguf -dev Vulkan0 -ngl 99 -n 32 --temp 0 -no-cnv \
              -p "Once upon a time" 2>/dev/null | tee /tmp/out.txt
            [ "$(wc -c < /tmp/out.txt)" -gt 40 ]
            b70-llama vulkan -m /models/tiny.gguf -dev Vulkan0 > /tmp/server.log 2>&1 &
            for i in $(seq 1 60); do curl -sf localhost:8080/health && break; sleep 1; done
            curl -sf localhost:8080/health || { tail -20 /tmp/server.log; exit 1; }
            grep -m1 -i "vulkan0\|llvmpipe" /tmp/server.log || true'
      - name: Push
        if: github.event_name != 'push' || github.ref == 'refs/heads/main'
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMG=ghcr.io/${{ github.repository_owner }}/b70-llama
          for t in "$TAG" latest; do docker tag b70-llama:ci "$IMG:$t"; docker push "$IMG:$t"; done
